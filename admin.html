<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIT CSE B - Admin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Rajalakshmi Institute of Technology</h1>
    <h2>Timetable Admin</h2>
    <p>II Year • 3rd Semester • CSE B</p>
</header>

<main>
    <div class="top-bar">
        <h2>✏️ Edit Timetable</h2>

        <select id="adminDay">
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Period</th>
                    <th>Time</th>
                    <th>Subject</th>
                    <th>Faculty</th>
                                   </tr>
            </thead>

            <tbody id="adminBody"></tbody>
        </table>
    </div>

    <br>

    <button id="saveButton">💾 Save Timetable</button>

    <p id="message"></p>
</main>

<footer>
    <p>RIT CSE B • Admin Panel</p>
</footer>

<script src="admin.js"></script>

</body>
</html>
